include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - node_modules/**
    - functions/node_modules/**
    - .worktrees/**
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 80
