name: tally
description: "Tally — Know what’s due. A personal obligation tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/fonts/dmsans-OFL.txt
    - assets/fonts/manrope-OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
          weight: 400
        - asset: assets/fonts/DMSans.ttf
          weight: 500
        - asset: assets/fonts/DMSans.ttf
          weight: 600
        - asset: assets/fonts/DMSans.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
