name: Tally validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tally-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  expo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/tally/package-lock.json
      - run: npm --prefix apps/tally ci
      - run: tool/check_expo.sh
      - run: node --test tool/tests/expo_install.test.mjs tool/tests/expo_release.test.mjs tool/tests/expo_ocr.test.mjs
      - run: npx expo export --platform all
        working-directory: apps/tally
      - run: node tool/prepare_expo_web.mjs
  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - run: npm install --no-save --package-lock=false supabase@2.120.0 deno@2.9.6
      - run: |
          echo "TALLY_SUPABASE_CLI=$PWD/node_modules/.bin/supabase" >> "$GITHUB_ENV"
      - run: python3 tool/start_supabase_local.py
      - run: npx supabase test db
      - run: npx supabase db advisors --local --type security --level warn --fail-on error
      - run: npx deno check --config supabase/functions/deno.json supabase/functions/tally-api/index.ts supabase/functions/tally-worker/index.ts
      - run: npx deno test --config supabase/functions/deno.json --allow-read=firebase/fixtures supabase/tests/functions
      - run: |
          npx supabase functions serve tally-api --no-verify-jwt > "$RUNNER_TEMP/tally-edge.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          for attempt in range(30):
              try:
                  request=urllib.request.Request('http://127.0.0.1:56321/functions/v1/tally-api',method='OPTIONS')
                  if urllib.request.urlopen(request,timeout=5).status==204: break
              except (urllib.error.URLError, TimeoutError): time.sleep(1)
          else: raise RuntimeError('Local Edge worker did not start.')
          PY
      - run: node tool/test_expo_borrower_api.mjs
      - run: python3 tool/test_supabase_financial.py
      - run: python3 tool/test_supabase_recurring.py
      - run: python3 tool/test_supabase_devices.py
      - run: python3 tool/test_supabase_files.py
      - run: python3 tool/test_supabase_recurring_after_payment.py
      - name: Install browser test tools
        run: |
          npm --prefix apps/tally ci
          npm install --prefix "$RUNNER_TEMP/tally-browser-tools" --no-save --package-lock=false playwright@1.64.0
          "$RUNNER_TEMP/tally-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          npx --yes chrome-devtools-axi@0.1.41 --help > /dev/null
          node -e 'console.log("TALLY_CHROME_BIN=" + require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/tally-browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Build local browser test app
        run: python3 tool/build_expo_local.py
      - name: Check desktop, mobile, borrower sharing, offline replay, and account deletion
        run: node tool/test_expo_journeys.mjs
      - if: always()
        run: npx supabase stop --no-backup
